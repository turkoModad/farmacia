<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Farmacia</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Farmacia</h1>
                <p>Sistema de Control de Inventario</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Ingresa tu usuario" 
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Ingresa tu contraseña" 
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;">
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <span id="buttonText">Iniciar Sesión</span>
                    <span id="buttonSpinner" style="display: none;">entrando</span>

                </button>
            </form>
            
            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="#" id="registerLink">Regístrate aquí</a></p>
                <p class="version">v1.0.0</p>
            </div>
        </div>
        
        <div id="registerModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Registro de Usuario</h2>
                    <button class="close-modal" id="closeRegister">&times;</button>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regUsername">Usuario</label>
                        <input type="text" id="regUsername" placeholder="Elige un usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Contraseña</label>
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="regConfirmPassword" placeholder="Repite tu contraseña" required>
                    </div>
                    <div id="registerError" class="error-message" style="display: none;"></div>
                    <button type="submit" class="register-button">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
